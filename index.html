<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topology & Manifest — APK.audio</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .workspace {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      padding: 16px 20px;
    }
    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      overflow-y: auto;
      flex: 1;
      padding-top: 10px;
    }
    .toolbar-bar {
      height: 42px;
      background: var(--osc-bg-surface);
      border-bottom: 1px solid var(--osc-border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
  </style>
</head>
<body>
  <header class="app-window-header">
    <div class="window-title-group">
      <div class="window-dot" style="background: #10B981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);"></div>
      <span class="window-title">Topology & Manifest Visualizer</span>
      <span class="window-pill" id="block-tag" style="color: #10B981;">PROJECT MANIFEST</span>
    </div>
    <div class="window-actions">
      <button class="btn btn-secondary btn-sm" id="btn-open-block">📂 Open Block</button>
      <button class="btn btn-secondary btn-sm" id="btn-discovered">⚡ Discovered</button>
      <button class="btn btn-secondary btn-sm" id="btn-export-html">📄 Export Standalone HTML</button>
      <button class="btn btn-primary btn-sm" id="btn-save-block">💾 Save & Return</button>
      <button class="btn btn-icon btn-sm" id="btn-close" title="Close Window">✕</button>
    </div>
  </header>

  <div class="toolbar-bar">
    <div style="display: flex; align-items: center; gap: 10px;">
      <input type="text" class="input" id="inp-search" placeholder="🔍 Search entities, IP, room, or mnemonic..." style="width: 320px; height: 28px;">
      <button class="btn btn-secondary btn-sm" id="btn-add-entity">➕ Add Entity</button>
    </div>
    <div id="telemetry-metrics"></div>
  </div>

  <div class="workspace">
    <div id="type-pills" style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;"></div>
    <div class="cards-container" id="cards-grid">
      <!-- Entity cards rendered dynamically -->
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
